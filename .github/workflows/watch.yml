name: bilet-takip

on:
  schedule:
    - cron: "*/15 * * * *"   # yedek: GitHub cron'u güvenilir olmadığı için asıl süreklilik kendini tetikleyerek sağlanır
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Üst üste binen çalıştırmalar sıraya girer, birbirini iptal etmez.
concurrency:
  group: bilet-takip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Takip et (~50 dk)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MINUTES: "50"
        run: python bot.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bilet-bot"
          git config user.email "bilet-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
      - name: Bir sonraki turu başlat (zincir)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bilet-takip.yml --repo "${{ github.repository }}" --ref main
